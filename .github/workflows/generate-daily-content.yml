name: Generate daily learning content

on:
  schedule:
    - cron: "15 15 * * *" # 00:15 Asia/Seoul
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-learning-content
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and validate the next day
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-nano
        run: node scripts/generate-content.mjs
      - name: Commit generated content
        run: |
          if git diff --quiet -- generated-content.json; then
            echo "No content change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-content.json
          git commit -m "Add daily business English content"
          git push
